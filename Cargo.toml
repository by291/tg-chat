[package]
name = "tg-chat"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-only"
publish = false

[dependencies]
aes-gcm = "=0.10.3"
email_address = "=0.2.9"
lettre = { version = "=0.11.23", default-features = false, features = [
    "builder",
    "smtp-transport",
    "pool",
    "tokio1-rustls-tls",
] }
argon2 = { version = "=0.6.0", features = ["getrandom"] }
base64 = "=0.22.1"
chrono = { version = "=0.4.45", features = ["serde"] }
cookie = "=0.18.2"
getrandom = "=0.4.3"
redis = { version = "=0.32.7", features = ["tokio-comp", "connection-manager"] }
sha2 = "=0.11.1"
subtle = "=2.6.1"
url = "=2.5.8"
axum = "=0.8.9"
clap = { version = "=4.6.7", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "=0.9.0", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring-webpki",
    "postgres",
    "migrate",
    "macros",
    "uuid",
    "chrono",
    "json",
] }
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = [
    "macros",
    "rt-multi-thread",
    "signal",
    "net",
    "time",
] }
tokio-util = "=0.7.20"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["json", "env-filter"] }
utoipa = { version = "=5.5.0", features = ["uuid", "chrono"] }
uuid = { version = "=1.29.0", features = ["v4", "serde"] }
ammonia = "=4.2.3"
scraper = "=0.27.0"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "=0.5.3", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
