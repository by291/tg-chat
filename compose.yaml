x-application: &application
  build:
    context: .
    dockerfile: deploy/Dockerfile
    target: runtime
  environment: &application-environment
    TG_CHAT_DATABASE_URL: >-
      postgres://tg_chat:${TG_CHAT_DATABASE_PASSWORD:?Generate .env first}@postgres:5432/tg_chat
    TG_CHAT_LOG_LEVEL: ${TG_CHAT_LOG_LEVEL:-info}
    TG_CHAT_PUBLIC_ORIGIN: ${TG_CHAT_PUBLIC_ORIGIN:-http://localhost:8080}
    TG_CHAT_VALKEY_URL: redis://valkey:6379
    TG_CHAT_CENTRIFUGO_URL: http://centrifugo:8000
    TG_CHAT_CENTRIFUGO_API_KEY: ${TG_CHAT_CENTRIFUGO_API_KEY:?Generate .env first}
    TG_CHAT_CENTRIFUGO_PROXY_KEY: ${TG_CHAT_CENTRIFUGO_PROXY_KEY:?Generate .env first}
    TG_CHAT_MEDIA_ENABLED: ${TG_CHAT_MEDIA_ENABLED:-false}
    TG_CHAT_MEDIA_STAGING_BYTES: ${TG_CHAT_MEDIA_STAGING_BYTES:-536870912}
    TG_CHAT_MEDIA_ORIGINAL_BYTES: ${TG_CHAT_MEDIA_ORIGINAL_BYTES:-1073741824}
    TG_CHAT_MEDIA_VARIANT_BYTES: ${TG_CHAT_MEDIA_VARIANT_BYTES:-536870912}
    TG_CHAT_S3_INTERNAL_ENDPOINT: ${TG_CHAT_S3_INTERNAL_ENDPOINT:-http://rustfs:9000}
    TG_CHAT_S3_PUBLIC_ENDPOINT: ${TG_CHAT_S3_PUBLIC_ENDPOINT:-http://127.0.0.1:8333}
    TG_CHAT_S3_ACCESS_KEY: ${TG_CHAT_S3_ACCESS_KEY:?Generate .env first}
    TG_CHAT_S3_SECRET_KEY: ${TG_CHAT_S3_SECRET_KEY:?Generate .env first}
    TG_CHAT_CALLS_ENABLED: ${TG_CHAT_CALLS_ENABLED:-false}
    TG_CHAT_LIVEKIT_INTERNAL_URL: ${TG_CHAT_LIVEKIT_INTERNAL_URL:-http://livekit:7880}
    TG_CHAT_LIVEKIT_PUBLIC_URL: ${TG_CHAT_LIVEKIT_PUBLIC_URL:-}
    TG_CHAT_LIVEKIT_API_KEY: ${TG_CHAT_LIVEKIT_API_KEY:-}
    TG_CHAT_LIVEKIT_API_SECRET: ${TG_CHAT_LIVEKIT_API_SECRET:-}
    TG_CHAT_TRUST_GATEWAY: 'true'
    TG_CHAT_SMTP_HOST: ${TG_CHAT_SMTP_HOST:-}
    TG_CHAT_SMTP_PORT: ${TG_CHAT_SMTP_PORT:-587}
    TG_CHAT_SMTP_MODE: ${TG_CHAT_SMTP_MODE:-starttls}
    TG_CHAT_MAIL_FROM: ${TG_CHAT_MAIL_FROM:-}
    TG_CHAT_MAIL_KEY: ${TG_CHAT_MAIL_KEY:-}
    TG_CHAT_SMTP_USERNAME: ${TG_CHAT_SMTP_USERNAME:-}
    TG_CHAT_SMTP_PASSWORD: ${TG_CHAT_SMTP_PASSWORD:-}
  init: true
  stop_grace_period: 45s

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: tg_chat
      POSTGRES_DB: tg_chat
      POSTGRES_PASSWORD: ${TG_CHAT_DATABASE_PASSWORD:?Generate .env first}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U tg_chat -d tg_chat'
      interval: 2s
      timeout: 3s
      retries: 30

  valkey:
    image: valkey/valkey:9.1.2-alpine
    command:
      - valkey-server
      - --appendonly
      - 'yes'
    volumes:
      - valkey-data:/data
    healthcheck:
      test:
        - CMD
        - valkey-cli
        - ping
      interval: 2s
      timeout: 3s
      retries: 30

  centrifugo:
    image: centrifugo/centrifugo:v6.10.2
    command: [centrifugo, --config=/etc/centrifugo/config.json]
    environment:
      CENTRIFUGO_HTTP_API_KEY: ${TG_CHAT_CENTRIFUGO_API_KEY:?Generate .env first}
      CENTRIFUGO_CLIENT_ALLOWED_ORIGINS: ${TG_CHAT_PUBLIC_ORIGIN:-http://localhost:8080}
      CENTRIFUGO_CLIENT_PROXY_CONNECT_HTTP_STATIC_HEADERS: >-
        {"X-TG-Proxy-Key":"${TG_CHAT_CENTRIFUGO_PROXY_KEY:?Generate .env first}"}
      CENTRIFUGO_CLIENT_PROXY_REFRESH_HTTP_STATIC_HEADERS: >-
        {"X-TG-Proxy-Key":"${TG_CHAT_CENTRIFUGO_PROXY_KEY:?Generate .env first}"}
    volumes:
      - ./deploy/centrifugo.json:/etc/centrifugo/config.json:ro
    depends_on:
      valkey:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - 'http://localhost:8000/health'
      interval: 2s
      timeout: 3s
      retries: 30

  rustfs:
    image: rustfs/rustfs:1.0.5
    environment:
      RUSTFS_ACCESS_KEY: ${TG_CHAT_S3_ACCESS_KEY:?Generate .env first}
      RUSTFS_SECRET_KEY: ${TG_CHAT_S3_SECRET_KEY:?Generate .env first}
      RUSTFS_CONSOLE_ENABLE: 'false'
      RUSTFS_CHECK_UPDATE: 'false'
    volumes:
      - rustfs-data:/data
    stop_grace_period: 20s
    healthcheck:
      test: [CMD, curl, --fail, --silent, --show-error, 'http://127.0.0.1:9000/health/ready']
      interval: 2s
      timeout: 3s
      retries: 40

  media-origin:
    image: caddy:2.11.7-alpine
    volumes:
      - ./deploy/MediaCaddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - '127.0.0.1:${TG_CHAT_S3_PORT:-8333}:8333'
    depends_on:
      rustfs:
        condition: service_healthy

  migrate:
    <<: *application
    command: [api, migrate]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *application
    command: [api, serve]
    environment:
      <<: *application-environment
      TG_CHAT_BIND_ADDRESS: 0.0.0.0:8080
      TG_CHAT_PUSH_VAPID_PUBLIC_KEY: ${TG_CHAT_PUSH_VAPID_PUBLIC_KEY:-}
      TG_CHAT_PUSH_PROVIDER_HOSTS: ${TG_CHAT_PUSH_PROVIDER_HOSTS:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - 'http://localhost:8080/health/ready'
      interval: 2s
      timeout: 4s
      retries: 30

  worker:
    <<: *application
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: media-worker
    command: [worker]
    environment:
      <<: *application-environment
      TG_CHAT_BIND_ADDRESS: 0.0.0.0:8081
      TG_CHAT_PUSH_VAPID_PUBLIC_KEY: ${TG_CHAT_PUSH_VAPID_PUBLIC_KEY:-}
      TG_CHAT_PUSH_VAPID_PRIVATE_KEY: ${TG_CHAT_PUSH_VAPID_PRIVATE_KEY:-}
      TG_CHAT_PUSH_VAPID_SUBJECT: ${TG_CHAT_PUSH_VAPID_SUBJECT:-}
      TG_CHAT_PUSH_PROVIDER_HOSTS: ${TG_CHAT_PUSH_PROVIDER_HOSTS:-}
      TG_CHAT_LINK_PREVIEW_ENDPOINT: http://link-preview-fetcher:8091/preview
    networks:
      default:
        gw_priority: 1
      preview-control: {}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - 'http://localhost:8081/health/ready'
      interval: 2s
      timeout: 4s
      retries: 30

  link-preview-fetcher:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: preview-fetcher
    # Bind the control API exclusively to the Worker network, even on a dual-homed container.
    command:
      - /bin/sh
      - -ec
      - |
        address=$$(ip -4 -o addr show dev preview_control scope global |
          awk 'NR == 1 { split($$4, address, "/"); print address[1] }')
        test -n "$$address"
        export LINK_PREVIEW_FETCHER_BIND="$$address:8091"
        exec link-preview-fetcher
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks:
      preview-control:
        interface_name: preview_control
      preview-egress:
        gw_priority: 1

  gateway:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: gateway
    ports:
      - '127.0.0.1:${TG_CHAT_HTTP_PORT:-8080}:80'
    depends_on:
      api:
        condition: service_healthy
      centrifugo:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - 'http://localhost/health/live'
      interval: 2s
      timeout: 3s
      retries: 30

  livekit:
    profiles: [calls]
    image: livekit/livekit-server:v1.13.11
    command: [--config=/etc/livekit/config.yaml]
    environment:
      LIVEKIT_KEYS: "${TG_CHAT_LIVEKIT_API_KEY:-}: ${TG_CHAT_LIVEKIT_API_SECRET:-}"
    volumes:
      - ./deploy/livekit.yaml:/etc/livekit/config.yaml:ro
    ports:
      - '127.0.0.1:7881:7881/tcp'
      - '127.0.0.1:7882:7882/udp'
      - '127.0.0.1:3478:3478/udp'

  mailpit:
    profiles: [mail]
    image: axllent/mailpit:v1.33.1
    ports:
      - '127.0.0.1:${TG_CHAT_MAILPIT_PORT:-8025}:8025'
    healthcheck:
      test: [CMD, /mailpit, readyz]
      interval: 2s
      timeout: 3s
      retries: 30

  verification:
    profiles: [verification]
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: verification
    environment:
      TG_CHAT_TEST_VALKEY_URL: redis://valkey:6379
      TG_CHAT_TEST_SMTP_HOST: mailpit
      TG_CHAT_TEST_SMTP_PORT: '1025'
      TG_CHAT_TEST_S3_ENDPOINT: http://rustfs:9000
      TG_CHAT_TEST_S3_PUBLIC_ENDPOINT: http://media-origin:8333
      TG_CHAT_TEST_S3_ACCESS_KEY: ${TG_CHAT_S3_ACCESS_KEY:?Generate .env first}
      TG_CHAT_TEST_S3_SECRET_KEY: ${TG_CHAT_S3_SECRET_KEY:?Generate .env first}
      DATABASE_URL: >-
        postgres://tg_chat:${TG_CHAT_DATABASE_PASSWORD:?Generate .env first}@postgres:5432/tg_chat
    depends_on:
      postgres:
        condition: service_healthy

networks:
  preview-control:
    internal: true
    driver: bridge
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
  preview-egress:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: 'false'

volumes:
  postgres-data:
  valkey-data:
  rustfs-data:
