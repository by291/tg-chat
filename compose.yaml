x-application: &application
  build:
    context: .
    dockerfile: deploy/Dockerfile
    target: runtime
  environment: &application-environment
    TG_CHAT_DATABASE_URL: >-
      postgres://tg_chat:${TG_CHAT_DATABASE_PASSWORD:?Generate .env first}@postgres:5432/tg_chat
    TG_CHAT_LOG_LEVEL: ${TG_CHAT_LOG_LEVEL:-info}
    TG_CHAT_PUBLIC_ORIGIN: ${TG_CHAT_PUBLIC_ORIGIN:-http://localhost:8080}
    TG_CHAT_VALKEY_URL: redis://valkey:6379
    TG_CHAT_TRUST_GATEWAY: 'true'
    TG_CHAT_SMTP_HOST: ${TG_CHAT_SMTP_HOST:-}
    TG_CHAT_SMTP_PORT: ${TG_CHAT_SMTP_PORT:-587}
    TG_CHAT_SMTP_MODE: ${TG_CHAT_SMTP_MODE:-starttls}
    TG_CHAT_MAIL_FROM: ${TG_CHAT_MAIL_FROM:-}
    TG_CHAT_MAIL_KEY: ${TG_CHAT_MAIL_KEY:-}
    TG_CHAT_SMTP_USERNAME: ${TG_CHAT_SMTP_USERNAME:-}
    TG_CHAT_SMTP_PASSWORD: ${TG_CHAT_SMTP_PASSWORD:-}
  init: true
  stop_grace_period: 45s

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: tg_chat
      POSTGRES_DB: tg_chat
      POSTGRES_PASSWORD: ${TG_CHAT_DATABASE_PASSWORD:?Generate .env first}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U tg_chat -d tg_chat'
      interval: 2s
      timeout: 3s
      retries: 30

  valkey:
    image: valkey/valkey:9.1.2-alpine
    command:
      - valkey-server
      - --appendonly
      - 'yes'
    volumes:
      - valkey-data:/data
    healthcheck:
      test:
        - CMD
        - valkey-cli
        - ping
      interval: 2s
      timeout: 3s
      retries: 30

  centrifugo:
    image: centrifugo/centrifugo:v6.10.2
    command: [centrifugo, --config=/etc/centrifugo/config.json]
    environment:
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: ${TG_CHAT_CENTRIFUGO_TOKEN_KEY:?Generate .env first}
      CENTRIFUGO_HTTP_API_KEY: ${TG_CHAT_CENTRIFUGO_API_KEY:?Generate .env first}
      CENTRIFUGO_CLIENT_ALLOWED_ORIGINS: ${TG_CHAT_PUBLIC_ORIGIN:-http://localhost:8080}
    volumes:
      - ./deploy/centrifugo.json:/etc/centrifugo/config.json:ro
    depends_on:
      valkey:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - 'http://localhost:8000/health'
      interval: 2s
      timeout: 3s
      retries: 30

  seaweedfs:
    image: chrislusf/seaweedfs:4.51
    entrypoint: [/bin/sh, /etc/seaweedfs/start.sh]
    environment:
      TG_CHAT_S3_ACCESS_KEY: ${TG_CHAT_S3_ACCESS_KEY:?Generate .env first}
      TG_CHAT_S3_SECRET_KEY: ${TG_CHAT_S3_SECRET_KEY:?Generate .env first}
    volumes:
      - seaweed-data:/data
      - ./deploy/start-seaweedfs.sh:/etc/seaweedfs/start.sh:ro
      - ./deploy/filer.toml:/etc/seaweedfs/filer.toml:ro
      - ./deploy/s3.json:/etc/seaweedfs/s3.json:ro
    ports:
      - '127.0.0.1:${TG_CHAT_S3_PORT:-8333}:8333'
    stop_grace_period: 20s
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - 'http://localhost:9333/cluster/status'
      interval: 2s
      timeout: 3s
      retries: 40

  migrate:
    <<: *application
    command: [api, migrate]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *application
    command: [api, serve]
    environment:
      <<: *application-environment
      TG_CHAT_BIND_ADDRESS: 0.0.0.0:8080
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - 'http://localhost:8080/health/ready'
      interval: 2s
      timeout: 4s
      retries: 30

  worker:
    <<: *application
    command: [worker]
    environment:
      <<: *application-environment
      TG_CHAT_BIND_ADDRESS: 0.0.0.0:8081
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - 'http://localhost:8081/health/ready'
      interval: 2s
      timeout: 4s
      retries: 30

  gateway:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: gateway
    ports:
      - '127.0.0.1:${TG_CHAT_HTTP_PORT:-8080}:80'
    depends_on:
      api:
        condition: service_healthy
      centrifugo:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - 'http://localhost/health/live'
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    profiles: [mail]
    image: axllent/mailpit:v1.33.1
    ports:
      - '127.0.0.1:${TG_CHAT_MAILPIT_PORT:-8025}:8025'
    healthcheck:
      test: [CMD, /mailpit, readyz]
      interval: 2s
      timeout: 3s
      retries: 30

  verification:
    profiles: [verification]
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: verification
    environment:
      TG_CHAT_TEST_VALKEY_URL: redis://valkey:6379
      TG_CHAT_TEST_SMTP_HOST: mailpit
      TG_CHAT_TEST_SMTP_PORT: '1025'
      DATABASE_URL: >-
        postgres://tg_chat:${TG_CHAT_DATABASE_PASSWORD:?Generate .env first}@postgres:5432/tg_chat
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  valkey-data:
  seaweed-data:
