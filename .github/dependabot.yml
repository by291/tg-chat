version: 2

updates:
  - package-ecosystem: cargo
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      cargo-patches:
        patterns: ['*']
        update-types: [patch]
    commit-message:
      prefix: 'build(deps)'

  - package-ecosystem: npm
    directory: '/web'
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      # The editor and React packages are used together and should be reviewed together.
      lexical:
        patterns: ['lexical', '@lexical/*']
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
    commit-message:
      prefix: 'build(deps)'

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    commit-message:
      prefix: 'ci(deps)'

  - package-ecosystem: docker
    directory: '/deploy'
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    commit-message:
      prefix: 'build(deps)'

  - package-ecosystem: docker-compose
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    commit-message:
      prefix: 'build(deps)'
