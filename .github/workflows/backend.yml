name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_PASSWORD: isolated-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      valkey:
        image: valkey/valkey:9.1.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      mailpit:
        image: axllent/mailpit:v1.33.1
        ports:
          - 1025:1025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TG_CHAT_TEST_VALKEY_URL: redis://localhost:6379
      TG_CHAT_TEST_SMTP_HOST: localhost
      TG_CHAT_TEST_SMTP_PORT: '1025'
      DATABASE_URL: postgres://postgres:isolated-ci-password@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml
          run_install: false
      - name: Install Rust toolchain
        run: >-
          rustup toolchain install 1.98.0 --profile minimal
          --component rustfmt --component clippy
      - name: Select Rust toolchain
        run: rustup override set 1.98.0
      - name: Install frontend tooling
        run: pnpm --dir web install --frozen-lockfile
      - name: Install media processor prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg libseccomp-dev util-linux
      - name: Start isolated object storage
        run: |
          node --input-type=module - <<'JS'
          import { appendFileSync, writeFileSync } from 'node:fs';
          import { createRuntimeEnvironment, serializeEnvironment } from './scripts/runtime-environment.mjs';

          const environment = createRuntimeEnvironment();
          const path = process.env.RUNNER_TEMP + '/tg-chat-media.env';
          writeFileSync(path, serializeEnvironment(environment), { mode: 0o600 });
          const testSettings = {
            TG_CHAT_TEST_S3_ENDPOINT: environment.TG_CHAT_S3_PUBLIC_ENDPOINT,
            TG_CHAT_TEST_S3_ACCESS_KEY: environment.TG_CHAT_S3_ACCESS_KEY,
            TG_CHAT_TEST_S3_SECRET_KEY: environment.TG_CHAT_S3_SECRET_KEY,
          };
          appendFileSync(process.env.GITHUB_ENV, serializeEnvironment(testSettings));
          JS
          docker compose --env-file "$RUNNER_TEMP/tg-chat-media.env" \
            -p tg-chat-native-media up -d --wait seaweedfs
      - name: Check formatting
        run: |
          cargo fmt --all --check
          pnpm --dir web exec prettier --check --config .prettierrc.json \
            ../compose.yaml ../.github/workflows/backend.yml ../scripts/*.mjs \
            ../docs/development.md ../docs/operations.md ../openapi/api.json
      - name: Lint Rust
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test accounts and jobs with real services
        run: cargo test --locked --all-targets -- --include-ignored
      - name: Verify generated API contracts
        run: pnpm --dir web api:check

  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
          run_install: false
      - name: Install account browser tooling
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web exec playwright install --with-deps chromium
      - name: Verify the integrated runtime and persistent storage
        run: node scripts/check-runtime.mjs
