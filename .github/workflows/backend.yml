name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_PASSWORD: isolated-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      valkey:
        image: valkey/valkey:9.1.3-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      mailpit:
        image: axllent/mailpit:v1.33.1
        ports:
          - 1025:1025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      # Full debuginfo and incremental state can exhaust the runner while linking test binaries.
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      TG_CHAT_TEST_VALKEY_URL: redis://localhost:6379
      TG_CHAT_TEST_SMTP_HOST: localhost
      TG_CHAT_TEST_SMTP_PORT: '1025'
      DATABASE_URL: postgres://postgres:isolated-ci-password@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml
          run_install: false
      - name: Install Rust toolchain
        run: >-
          rustup toolchain install 1.98.0 --profile minimal
          --component rustfmt --component clippy
      - name: Select Rust toolchain
        run: rustup override set 1.98.0
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2.9.3
      - name: Install frontend tooling
        run: pnpm --dir web install --frozen-lockfile
      - name: Check formatting
        run: |
          cargo fmt --all --check
          pnpm --dir web exec prettier --check --config .prettierrc.json \
            ../compose.yaml ../deploy/compose.github-cache.yaml \
            ../.github/workflows/backend.yml ../scripts/*.mjs \
            ../docs/development.md ../docs/operations.md ../openapi/api.json
      - name: Install media processor prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg libseccomp-dev util-linux
      - name: Start isolated object storage
        run: |
          node --input-type=module - <<'JS'
          import { appendFileSync, writeFileSync } from 'node:fs';
          import {
            createRuntimeEnvironment,
            serializeEnvironment,
          } from './scripts/runtime-environment.mjs';

          const environment = createRuntimeEnvironment();
          const path = process.env.RUNNER_TEMP + '/tg-chat-media.env';
          writeFileSync(path, serializeEnvironment(environment), { mode: 0o600 });

          // GitHub prints job environment values in subsequent step logs.
          console.log(`::add-mask::${environment.TG_CHAT_S3_ACCESS_KEY}`);
          console.log(`::add-mask::${environment.TG_CHAT_S3_SECRET_KEY}`);

          const testSettings = {
            TG_CHAT_TEST_S3_ENDPOINT: environment.TG_CHAT_S3_PUBLIC_ENDPOINT,
            TG_CHAT_TEST_S3_ACCESS_KEY: environment.TG_CHAT_S3_ACCESS_KEY,
            TG_CHAT_TEST_S3_SECRET_KEY: environment.TG_CHAT_S3_SECRET_KEY,
          };
          appendFileSync(process.env.GITHUB_ENV, serializeEnvironment(testSettings));
          JS
          docker compose --env-file "$RUNNER_TEMP/tg-chat-media.env" \
            -p tg-chat-native-media up -d --wait media-origin
      - name: Lint Rust
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test accounts and jobs with real services
        # The LiveKit provider test requires the separate disposable calls runtime.
        run: >-
          cargo test --locked --all-targets -- --include-ignored
          --skip explicitly_created_room_can_be_listed_and_deleted
      - name: Verify generated API contracts
        run: pnpm --dir web api:check
      - name: Report disk usage
        if: always()
        run: df -h .

  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The link preview fetcher binds its control listener to a named network interface.
      - name: Set up Docker Engine
        uses: docker/setup-docker-action@v5.4.0
        with:
          version: v29.9.3
      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v2.4.0
        with:
          version: v5.7.0
      - name: Check Docker network interface support
        run: |
          docker version
          docker compose version

          engine_api_version=$(docker version --format '{{.Server.APIVersion}}')
          if ! dpkg --compare-versions "$engine_api_version" ge 1.49; then
            echo '::error::The preview fetcher requires Docker Engine API 1.49 or later.'
            exit 1
          fi
      - name: Set up Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4.4.1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml
          run_install: false
      - name: Install account browser tooling
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web exec playwright install --with-deps chromium
      - name: Expose the GitHub Actions cache to BuildKit
        uses: crazy-max/ghaction-github-runtime@v4.0.0
      - name: Verify the integrated runtime and persistent storage
        env:
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
        run: node scripts/check-runtime.mjs --github-build-cache
      - name: Save browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: runtime-browser-failures-${{ github.run_attempt }}
          path: web/test-results/
          retention-days: 7
          if-no-files-found: ignore
